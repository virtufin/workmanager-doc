  summary: >-
    Executes a worker-processing operation with retry. Throws the last

    exception once <xref href="Virtufin.WorkManager.Configuration.WorkerProcessingRetryOptions.RetryAttempts" data-throw-if-not-resolved="false"></xref>

    is exhausted -- callers are expected to dead-letter the message on

    that final failure rather than let it propagate further.
