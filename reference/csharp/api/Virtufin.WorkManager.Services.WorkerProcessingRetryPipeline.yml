  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Services
  summary: >-
    Polly-based retry pipeline for worker business-logic processing

    failures, as distinct from <xref href="Virtufin.WorkManager.Services.DaprResiliencePipeline" data-throw-if-not-resolved="false"></xref> (which

    wraps Dapr/Gateway infra calls). Exhausting all attempts lets the

    caller's exception propagate so it can dead-letter the message -- see

    <xref href="Virtufin.WorkManager.Configuration.WorkerProcessingRetryOptions" data-throw-if-not-resolved="false"></xref> for why this exists as its

    own pipeline.
