    id: ProbeEventType
    path: ../../../src/Virtufin.WorkManager/Components/WorkManager.cs
    startLine: 83
  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Components
  summary: >-
    CloudEvent type marking a topic liveness probe. Probes carry the

    publishing instance id in the <xref href="Virtufin.WorkManager.Components.WorkManager.ProbeInstanceExtension" data-throw-if-not-resolved="false"></xref>

    CloudEvent extension attribute; the handler echoes probes carrying

    its own id and drops all probes without dispatching them to workers.

    The marker must travel as CloudEvent attributes inside the payload —

    NOT as Dapr publish metadata — because the streamer populates

    TopicMessage.Type/Extensions from the CloudEvent envelope parsed out

    of the stored payload, not from the broker-level metadata.
  example: []
  syntax:
    content: public const string ProbeEventType = "com.virtufin.workmanager.topic-probe"
    return:
      type: System.String
    content.vb: Public Const ProbeEventType As String = "com.virtufin.workmanager.topic-probe"
