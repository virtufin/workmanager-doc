    id: PublishTopicAttribute
    path: ../../../src/Virtufin.WorkManager/Components/WorkManager.cs
    startLine: 1012
  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Components
  summary: >-
    Extension attribute a worker's response CloudEvent can carry to

    publish to a topic other than its own <code>ce-type</code>. Most workers

    don't need this -- their response's <xref href="CloudNative.CloudEvents.CloudEvent.Type" data-throw-if-not-resolved="false"></xref>

    serves as both the wire <code>ce-type</code> and the publish topic, which

    is why that's still the default. It exists for workers whose

    <code>ce-type</code> must stay a stable identifier independent of a

    per-scenario topic (e.g. the pubsub-topics spec's trading events:

    topic <code>sc.&lt;scenarioId&gt;.trading.order.submitted</code>, ce-type

    <code>com.virtufin.trading.order.submitted</code>). Stripped from the

    outgoing envelope before publish -- it's WorkManager-internal

    routing, not part of the event a subscriber should see.
  example: []
  syntax:
    content: public const string PublishTopicAttribute = "publishtopic"
    return:
      type: System.String
    content.vb: Public Const PublishTopicAttribute As String = "publishtopic"
