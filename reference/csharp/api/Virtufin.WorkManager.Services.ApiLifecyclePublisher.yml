  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Services
  summary: >-
    Publishes worker lifecycle events to the virtufin-api's

    <code>system-events</code> topic. Events are CloudEvents v1.0 envelopes

    with the WorkManager's URN as the source. The publisher is

    best-effort: failures are logged but never propagated, so an

    unreachable API does not break the WorkManager's worker state

    machine.
  example: []
