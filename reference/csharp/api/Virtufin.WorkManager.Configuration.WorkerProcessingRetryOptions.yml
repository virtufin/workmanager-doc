  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Configuration
  summary: >-
    Tunable knobs for <xref href="Virtufin.WorkManager.Services.WorkerProcessingRetryPipeline" data-throw-if-not-resolved="false"></xref>:

    the Polly-based retry wrapping <code>worker.ProcessAsync</code> in

    <code>WorkManager.ProcessCloudEventAsync</code>.


    Deliberately separate from <xref href="Virtufin.WorkManager.Configuration.DaprResilienceOptions" data-throw-if-not-resolved="false"></xref> even

    though the defaults happen to match: that class scopes Dapr *infra*

    call retries (state store, pubsub RPCs), this one scopes worker

    *business-logic* processing failures -- restoring the

    pubsub-topics spec's "Retry Policy on Dapr Subscribe Exceptions"

    bounded-retry-then-dead-letter guarantee, which the streaming

    Pubsub.Subscribe migration moved from Dapr's broker-level redelivery

    to WorkManager's own application-level responsibility (broker

    redelivery is architecturally inapplicable once a message is inside

    the Gateway's multi-consumer fan-out -- see spec's "In-process

    exception on a subscriber" requirement).
