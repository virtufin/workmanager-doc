      repo: https://git.haenerconsulting.com/virtufin/virtufin-workmanager
    id: DefaultConnectivityTimeoutSeconds
    path: ../../../src/Virtufin.WorkManager/Configuration/WorkerRecoveryOptions.cs
    startLine: 36
  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Configuration
  summary: >-
    Default connectivity timeout (120s). Covers cold-start races where the state-store

    sidecar (e.g. Dapr) isn't yet accepting connections when this instance starts —

    observed in production as a burst of "Connection refused" errors that outlasted the

    old fixed 30s <xref href="Virtufin.WorkManager.Configuration.WorkerRecoveryOptions.AcquireTimeoutSeconds" data-throw-if-not-resolved="false"></xref> window, permanently skipping recovery

    for that instance's lifetime.
  example: []
  syntax:
    content: public const int DefaultConnectivityTimeoutSeconds = 120
    return:
      type: System.Int32
    content.vb: Public Const DefaultConnectivityTimeoutSeconds As Integer = 120
