- uid: Virtufin.WorkManager.Components.SourceCredentialResolver.Resolve(Virtufin.WorkManager.Contracts.CodeSourceUrl,Virtufin.WorkManager.Protos.SourceCredential)
  commentId: M:Virtufin.WorkManager.Components.SourceCredentialResolver.Resolve(Virtufin.WorkManager.Contracts.CodeSourceUrl,Virtufin.WorkManager.Protos.SourceCredential)
  id: Resolve(Virtufin.WorkManager.Contracts.CodeSourceUrl,Virtufin.WorkManager.Protos.SourceCredential)
  parent: Virtufin.WorkManager.Components.SourceCredentialResolver
  langs:
  - csharp
  - vb
  name: Resolve(CodeSourceUrl, SourceCredential?)
  nameWithType: SourceCredentialResolver.Resolve(CodeSourceUrl, SourceCredential?)
  fullName: Virtufin.WorkManager.Components.SourceCredentialResolver.Resolve(Virtufin.WorkManager.Contracts.CodeSourceUrl, Virtufin.WorkManager.Protos.SourceCredential?)
  type: Method
  source:
    remote:
      path: src/Virtufin.WorkManager/Components/SourceCredentialResolver.cs
      branch: master
      repo: https://git.haenerconsulting.com/virtufin/workmanager
    id: Resolve
    path: ../../../src/Virtufin.WorkManager/Components/SourceCredentialResolver.cs
    startLine: 56
  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Components
  summary: >-
    Resolves the effective <xref href="System.Net.Http.Headers.AuthenticationHeaderValue" data-throw-if-not-resolved="false"></xref> for

    fetching <code class="paramref">urlSource</code>. <code class="paramref">liveCredential</code>

    (a fresh request's own <xref href="Virtufin.WorkManager.Protos.SourceCredential" data-throw-if-not-resolved="false"></xref>) takes

    precedence when present -- covers Basic/Bearer/named alike. Falls

    back to <xref href="Virtufin.WorkManager.Contracts.CodeSourceUrl.NamedCredential" data-throw-if-not-resolved="false"></xref> (the only

    credential kind that survives into persisted state) so a recovery

    re-fetch of a worker created with <code>authentication = "virtufin"</code>

    keeps working after a WorkManager restart, even with no live

    request credential. Returns <code>null</code> (no header) when neither is

    present.
  example: []
  syntax:
    content: public static AuthenticationHeaderValue? Resolve(CodeSourceUrl urlSource, SourceCredential? liveCredential)
    parameters:
    - id: urlSource
      type: Virtufin.WorkManager.Contracts.CodeSourceUrl
    - id: liveCredential
      type: Virtufin.WorkManager.Protos.SourceCredential
    return:
      type: System.Net.Http.Headers.AuthenticationHeaderValue
    content.vb: Public Shared Function Resolve(urlSource As CodeSourceUrl, liveCredential As SourceCredential) As AuthenticationHeaderValue
  overload: Virtufin.WorkManager.Components.SourceCredentialResolver.Resolve*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      The credential is a <code>named</code> reference that can't be resolved

      (unrecognized name, or the host isn't permitted for it).
  nameWithType.vb: SourceCredentialResolver.Resolve(CodeSourceUrl, SourceCredential)
  fullName.vb: Virtufin.WorkManager.Components.SourceCredentialResolver.Resolve(Virtufin.WorkManager.Contracts.CodeSourceUrl, Virtufin.WorkManager.Protos.SourceCredential)
  name.vb: Resolve(CodeSourceUrl, SourceCredential)
- uid: Virtufin.WorkManager.Components.SourceCredentialResolver.ResolveNamed(System.String,System.String,System.String@)
  commentId: M:Virtufin.WorkManager.Components.SourceCredentialResolver.ResolveNamed(System.String,System.String,System.String@)
  id: ResolveNamed(System.String,System.String,System.String@)
  parent: Virtufin.WorkManager.Components.SourceCredentialResolver
  langs:
  - csharp
  - vb
  name: ResolveNamed(string, string, out string?)
  nameWithType: SourceCredentialResolver.ResolveNamed(string, string, out string?)
  fullName: Virtufin.WorkManager.Components.SourceCredentialResolver.ResolveNamed(string, string, out string?)
  type: Method
  source:
    remote:
      path: src/Virtufin.WorkManager/Components/SourceCredentialResolver.cs
      branch: master
      repo: https://git.haenerconsulting.com/virtufin/workmanager
    id: ResolveNamed
    path: ../../../src/Virtufin.WorkManager/Components/SourceCredentialResolver.cs
    startLine: 104
  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Components
  summary: >-
    Resolves a <code>named</code> credential reference against

    <code class="paramref">targetHost</code>. Currently only

    <xref href="Virtufin.WorkManager.Components.SourceCredentialResolver.VirtufinRegistryCredentialName" data-throw-if-not-resolved="false"></xref> is recognized, read

    from <code>VIRTUFIN_REGISTRY_USER</code>/<code>VIRTUFIN_REGISTRY_TOKEN</code>

    process environment variables on each call (not cached -- these

    rarely change and reading them fresh keeps a rotated token picked

    up without a restart).
  example: []
  syntax:
    content: public static AuthenticationHeaderValue? ResolveNamed(string name, string targetHost, out string? error)
    parameters:
    - id: name
      type: System.String
    - id: targetHost
      type: System.String
    - id: error
      type: System.String
    return:
      type: System.Net.Http.Headers.AuthenticationHeaderValue
      description: >-
        An <xref href="System.Net.Http.Headers.AuthenticationHeaderValue" data-throw-if-not-resolved="false"></xref> on success, or

        <code>null</code> with <code class="paramref">error</code> set if the name is

        unrecognized, the host isn't permitted for it, or the org

        credential isn't configured on this instance.
    content.vb: Public Shared Function ResolveNamed(name As String, targetHost As String, [error] As String) As AuthenticationHeaderValue
  overload: Virtufin.WorkManager.Components.SourceCredentialResolver.ResolveNamed*
  nameWithType.vb: SourceCredentialResolver.ResolveNamed(String, String, String)
  fullName.vb: Virtufin.WorkManager.Components.SourceCredentialResolver.ResolveNamed(String, String, String)
  name.vb: ResolveNamed(String, String, String)
