    id: SourceCredentialResolver
    path: ../../../src/Virtufin.WorkManager/Components/SourceCredentialResolver.cs
    startLine: 20
  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Components
  summary: >-
    Resolves the effective <xref href="System.Net.Http.Headers.AuthenticationHeaderValue" data-throw-if-not-resolved="false"></xref> for a

    code source fetch (<code>WorkManager.FetchFromUrlAsync</code>) from a

    per-request <xref href="Virtufin.WorkManager.Protos.SourceCredential" data-throw-if-not-resolved="false"></xref>, replacing the former

    <code>RegistryAuthHandler</code> -- a <xref href="System.Net.Http.DelegatingHandler" data-throw-if-not-resolved="false"></xref>

    registered unconditionally on the <code>CodeFetcher</code>

    <xref href="System.Net.Http.IHttpClientFactory" data-throw-if-not-resolved="false"></xref> client and applied to every request

    whose host matched, regardless of whether the caller actually wanted

    the org credential used. Credentials are now explicit and per-request:

    a directly-supplied Basic/Bearer secret, or a <code>named</code> reference

    resolved server-side (see <xref href="Virtufin.WorkManager.Components.SourceCredentialResolver.ResolveNamed(System.String%2cSystem.String%2cSystem.String%40)" data-throw-if-not-resolved="false"></xref>) so that secret

    never has to be distributed to callers.
  example: []
  syntax:
    content: public static class SourceCredentialResolver
    content.vb: Public Module SourceCredentialResolver
