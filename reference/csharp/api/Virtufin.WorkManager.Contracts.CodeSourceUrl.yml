  assemblies:
  - Virtufin.WorkManager
  namespace: Virtufin.WorkManager.Contracts
  summary: Represents code sourced from a URL.
  example: []
  syntax:
    content: public CodeSourceUrl(Uri Url, string? ContentSha256 = null, string? NamedCredential = null)
    parameters:
    - id: Url
      type: System.Uri
      description: The URL pointing to the code.
    - id: ContentSha256
      type: System.String
      description: Optional SHA-256 digest of the expected content, for integrity verification.
    - id: NamedCredential
      type: System.String
      description: >-
        Optional server-resolved credential reference (e.g. <code>"virtufin"</code>),

        persisted so a worker recovery re-fetch can still authorize itself.

        Deliberately the ONLY credential material ever persisted here -- a

        directly-supplied Basic/Bearer secret (see

        <xref href="Virtufin.WorkManager.Protos.SourceCredential" data-throw-if-not-resolved="false"></xref>) is never written to this

        record or to any <xref href="Virtufin.WorkManager.Contracts.WorkerConfig" data-throw-if-not-resolved="false"></xref>/<xref href="Virtufin.WorkManager.Contracts.HistoryEntry" data-throw-if-not-resolved="false"></xref>

        state; it flows as a transient, per-call parameter through

        <code>WorkManager.CreateWorkerAsync</code>/<code>LoadCode</code> and is discarded

        after the fetch it authorizes. A worker created with a raw Basic/Bearer

        credential therefore won't have one available on recovery after a

        WorkManager restart -- a deliberate, documented tradeoff, not an

        oversight.
    content.vb: Public Sub New(Url As Uri, ContentSha256 As String = Nothing, NamedCredential As String = Nothing)
  overload: Virtufin.WorkManager.Contracts.CodeSourceUrl.#ctor*
